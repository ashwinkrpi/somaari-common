[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "somaari-common"
# pip requires a version. somaari-common is not versioned: this stays 0.0.0 forever.
version = "0.0.0"
description = "Shared About section data and debug-info collector for somaari apps."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/ashwinkrpi/somaari-common"

[tool.hatch.build.targets.wheel]
packages = ["somaari_about"]

# Pull the canonical JSON from ../about into the wheel without copying it in the repo.
[tool.hatch.build.targets.wheel.force-include]
"../about/developer.json" = "somaari_about/data/developer.json"
"../about/debug-fields.json" = "somaari_about/data/debug-fields.json"
